name: Resolve Issue with OpenHands

# Issue に "fix-me" ラベルを付ける、または Issue に
# "@openhands-agent ..." とコメントすると動きます。
# OpenHands 0.62.0 (2025-11) のリゾルバを固定して使います。
# 公式サンプルの "OpenHands/OpenHands/.github/workflows/openhands-resolver.yml@main" は
# 現在のmainに存在しないため、使っていません。

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    if: |
      github.event.label.name == 'fix-me' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'COLLABORATOR' ||
          github.event.comment.author_association == 'MEMBER'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MAX_ITERATIONS: ${{ vars.OPENHANDS_MAX_ITER || 20 }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id || 'None' }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "Error: secret LLM_API_KEY is not set."; exit 1
          fi
          if [ -z "$LLM_MODEL" ]; then
            echo "Error: repository variable LLM_MODEL is not set (example: gemini/<model name>)."; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenHands (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "openhands-ai==0.62.0"

      - name: Comment on issue with start message
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number(process.env.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `OpenHands started working on this issue. Progress: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Attempt to resolve issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: openhands-agent
          GIT_USERNAME: openhands-agent
          SANDBOX_ENV_GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ""
        run: |
          cd /tmp && python -m openhands.resolver.resolve_issue \
            --selected-repo "${{ github.repository }}" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-type issue \
            --max-iterations "$MAX_ITERATIONS" \
            --comment-id "$COMMENT_ID" \
            --is-experimental false

      - name: Check resolution result
        id: check_result
        if: always()
        run: |
          if cd /tmp && grep -q '"success":true' output/output.jsonl; then
            echo "RESOLUTION_SUCCESS=true" >> "$GITHUB_OUTPUT"
          else
            echo "RESOLUTION_SUCCESS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload output.jsonl
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolver-output
          path: /tmp/output/output.jsonl
          retention-days: 7
          if-no-files-found: ignore

      - name: Create draft PR or push branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: openhands-agent
          GIT_USERNAME: openhands-agent
          PYTHONPATH: ""
        run: |
          if [ "${{ steps.check_result.outputs.RESOLUTION_SUCCESS }}" == "true" ]; then
            cd /tmp && python -m openhands.resolver.send_pull_request \
              --issue-number "$ISSUE_NUMBER" \
              --target-branch "$TARGET_BRANCH" \
              --pr-type draft \
              --reviewer "${{ github.actor }}" | tee pr_result.txt && \
              grep "PR created" pr_result.txt | sed 's/.*\///g' > pr_number.txt
          else
            cd /tmp && python -m openhands.resolver.send_pull_request \
              --issue-number "$ISSUE_NUMBER" \
              --pr-type branch \
              --send-on-failure | tee branch_result.txt && \
              grep "branch created" branch_result.txt | sed 's/.*\///g; s/.expand=1//g' > branch_name.txt
          fi

      - name: Comment result on issue
        uses: actions/github-script@v7
        if: always()
        env:
          RESOLUTION_SUCCESS: ${{ steps.check_result.outputs.RESOLUTION_SUCCESS }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const read = (p) => { try { return fs.readFileSync(p, 'utf8').trim(); } catch (e) { return ''; } };
            const success = process.env.RESOLUTION_SUCCESS === 'true';
            const prNumber = read('/tmp/pr_number.txt');
            const branchName = read('/tmp/branch_name.txt');
            let body;
            if (success && prNumber) {
              body = `A draft PR #${prNumber} has been created. Please review the changes.`;
            } else if (branchName) {
              body = `The attempt was not fully successful. Branch '${branchName}' has the attempted changes: https://github.com/${owner}/${repo}/tree/${branchName}`;
            } else {
              body = `The workflow encountered an error. See the logs: ${runUrl}`;
            }
            await github.rest.issues.createComment({ issue_number, owner, repo, body });
