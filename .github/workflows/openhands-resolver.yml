name: Resolve Issue with OpenHands

# Issue に "fix-me" ラベルを付ける、または Issue に
# "@openhands-agent ..." とコメントすると動きます。
# 成功したらPRを作らず、変更を直接 main に反映し、Issue に作業のまとめを書き込みます。
# 失敗したら main には触れず、試した内容をブランチに残します。
# AIが何も変更しなかったときも、その状況をIssueに書き込みます。
# OpenHands 0.62.0 のリゾルバを固定して使います。
#
# 【予備モデル】
# 503(混雑)・429(上限)など通信系の失敗のときだけ、変数 LLM_MODEL_FALLBACK のモデルで
# 自動的にやり直します。カンマ区切りで複数指定できます(例: groq/モデルA,openrouter/モデルB)。
# 予備モデルが別の会社のものなら、Secrets に LLM_API_KEY_FALLBACK を作ってそのキーを入れます。
# (未設定なら LLM_API_KEY を使います。予備モデルは全部同じ会社のものにしてください)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: openhands-resolver
  cancel-in-progress: false

jobs:
  auto-fix:
    if: |
      github.event.label.name == 'fix-me' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'COLLABORATOR' ||
          github.event.comment.author_association == 'MEMBER'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_MODEL_FALLBACK: ${{ vars.LLM_MODEL_FALLBACK }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_NUM_RETRIES: "4"
      LLM_RETRY_MIN_WAIT: "60"
      LLM_RETRY_MAX_WAIT: "120"
      LLM_RETRY_MULTIPLIER: "1"
      MAX_ITERATIONS: ${{ vars.OPENHANDS_MAX_ITER || 20 }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id || 'None' }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "Error: secret LLM_API_KEY is not set."; exit 1
          fi
          if [ -z "$LLM_MODEL" ]; then
            echo "Error: repository variable LLM_MODEL is not set (example: gemini/<model name>)."; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OpenHands (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "openhands-ai==0.62.0"

      - name: Comment on issue with start message
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number(process.env.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `OpenHands が作業を開始しました。進み具合: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Attempt to resolve issue
        id: attempt
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: openhands-agent
          GIT_USERNAME: openhands-agent
          SANDBOX_ENV_GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ""
        run: |
          # ログを /tmp/attempt.log にも残します(予備モデルを使うか決めるため)。
          cd /tmp
          : > /tmp/attempt.log
          # 利用上限(429)になると OpenHands は何時間も待ち続けるため、
          # ログに RATE_LIMITED が出たらすぐ打ち切って、予備モデルに切り替えます。
          (
            while sleep 10; do
              if grep -q 'RATE_LIMITED' /tmp/attempt.log; then
                echo "利用上限を検知したため、このモデルでの実行を打ち切ります。"
                pkill -f 'openhands.resolver.resolve_issue' || true
                break
              fi
            done
          ) &
          WATCH=$!
          python -m openhands.resolver.resolve_issue \
            --selected-repo "${{ github.repository }}" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-type issue \
            --max-iterations "$MAX_ITERATIONS" \
            --comment-id "$COMMENT_ID" \
            --is-experimental false 2>&1 | tee -a /tmp/attempt.log
          RC=${PIPESTATUS[0]}
          kill "$WATCH" 2>/dev/null || true
          exit "$RC"

      # 1回目が「通信エラー」で失敗したときだけ、予備のモデルを順に試します。
      # (通信以外の失敗は、モデルを替えても直らないので試しません)
      - name: Retry with fallback models
        id: fallback
        if: steps.attempt.outcome == 'failure' && vars.LLM_MODEL_FALLBACK != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: openhands-agent
          GIT_USERNAME: openhands-agent
          SANDBOX_ENV_GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY_FALLBACK: ${{ secrets.LLM_API_KEY_FALLBACK }}
          PYTHONPATH: ""
        run: |
          cd /tmp
          if ! grep -Eqi 'ServiceUnavailable|RateLimit|RATE_LIMITED|RESOURCE_EXHAUSTED|quota|Overloaded|APIConnection|Timeout|\b503\b|\b429\b' /tmp/attempt.log; then
            echo "1回目の失敗は通信エラー・利用上限ではないため、予備モデルは試しません。"
            exit 1
          fi
          FB_KEY="${LLM_API_KEY_FALLBACK:-$LLM_API_KEY}"
          for M in $(echo "$LLM_MODEL_FALLBACK" | tr ',' ' '); do
            echo "Trying fallback model: $M"
            # OpenHands のコンテナが作ったファイルは root 所有なので sudo が必要です。
            sudo rm -rf /tmp/output
            if LLM_MODEL="$M" LLM_API_KEY="$FB_KEY" python -m openhands.resolver.resolve_issue \
              --selected-repo "${{ github.repository }}" \
              --issue-number "$ISSUE_NUMBER" \
              --issue-type issue \
              --max-iterations "$MAX_ITERATIONS" \
              --comment-id "$COMMENT_ID" \
              --is-experimental false; then
              echo "Fallback model worked: $M"
              exit 0
            fi
          done
          echo "All fallback models failed."
          exit 1

      - name: Check resolution result
        id: check_result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          ok = False
          try:
              line = next(l for l in open('/tmp/output/output.jsonl', encoding='utf-8') if l.strip())
              ok = bool(json.loads(line).get('success'))
          except Exception:
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('RESOLUTION_SUCCESS=%s\n' % ('true' if ok else 'false'))
          PY

      # AIの作業結果を読み取り、ログとIssueのコメント用に要点を残します。
      - name: Summarize output
        id: summarize
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          out = '/tmp/output/output.jsonl'
          res = {'has_patch': False, 'success': False, 'patch_len': 0, 'events': 0,
                 'explanation': '', 'error': '', 'last_agent': '', 'answer': '',
                 'no_output': False}
          try:
              line = next(l for l in open(out, encoding='utf-8') if l.strip())
              d = json.loads(line)
              patch = d.get('git_patch') or ''
              res['has_patch'] = bool(patch.strip())
              res['patch_len'] = len(patch)
              res['success'] = bool(d.get('success'))
              res['explanation'] = (d.get('result_explanation') or '')[:1500]
              res['error'] = str(d.get('error') or '')[:800]
              hist = d.get('history') or []
              res['events'] = len(hist)
              for ev in reversed(hist):
                  if ev.get('source') == 'agent':
                      msg = ev.get('message') or ev.get('content') or ''
                      if isinstance(msg, str) and msg.strip():
                          res['last_agent'] = msg.strip()[:800]
                          break
              # AIの最終的な回答(質問への答え)を取り出します。
              # source が agent のものだけを見ます(user の依頼文を拾わないため)。
              # 1) finish(AIの完了報告)は必ずAIの発言なので、source を見ずに最優先で探します。
              # 2) なければ message のうち、依頼文(user)ではないものを探します。
              def is_user(ev):
                  src = str(ev.get('source') or '').lower()
                  txt = (ev.get('content') or ev.get('message') or (ev.get('args') or {}).get('content') or '')
                  return src == 'user' or str(txt).startswith('Please fix the following issue')
              for ev in reversed(hist):
                  if ev.get('action') == 'finish':
                      a = ev.get('args') or {}
                      text = str(ev.get('final_thought') or a.get('final_thought') or a.get('thought') or '').strip()
                      if text:
                          res['answer'] = text[:3000]
                          break
              if not res['answer']:
                  for ev in reversed(hist):
                      if ev.get('action') == 'message' and not is_user(ev):
                          text = str(ev.get('content') or (ev.get('args') or {}).get('content') or '').strip()
                          if text:
                              res['answer'] = text[:3000]
                              break
              # 原因調査用: 最後の3件の種類をログに出します。
              print('DEBUG last events:', [(e.get('action'), e.get('source')) for e in hist[-3:]])
          except Exception as e:
              res['no_output'] = True
              res['error'] = 'output.jsonl を読めませんでした: %s' % e
          json.dump(res, open('/tmp/summary.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(json.dumps(res, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('HAS_PATCH=%s\n' % ('true' if res['has_patch'] else 'false'))
          PY

      - name: Upload output.jsonl
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolver-output
          path: /tmp/output/output.jsonl
          retention-days: 7
          if-no-files-found: ignore

      # 変更があるときだけ、作業用ブランチに送ります(成功でも失敗でも)。
      - name: Push work branch
        id: push_branch
        if: always() && steps.summarize.outputs.HAS_PATCH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: openhands-agent
          GIT_USERNAME: openhands-agent
          PYTHONPATH: ""
        run: |
          cd /tmp
          # コンテナが作ったファイルの所有者が違っても git が止まらないようにします。
          git config --global --add safe.directory '*'
          # リゾルバの記録は標準エラーに出るため、2>&1 で取り込みます。
          python -m openhands.resolver.send_pull_request \
            --issue-number "$ISSUE_NUMBER" \
            --pr-type branch \
            --send-on-failure 2>&1 | tee branch_result.txt || true
          grep "branch created" branch_result.txt | head -n 1 | sed 's/.*\///g; s/.expand=1//g' > branch_name.txt || true
          BRANCH="$(cat branch_name.txt)"
          if [ -z "$BRANCH" ]; then
            # 記録から読めないときは、リモートのブランチ一覧から探します。
            BRANCH="$(git -C "$GITHUB_WORKSPACE" ls-remote --heads origin "openhands-fix-issue-${ISSUE_NUMBER}*" | awk '{print $2}' | sed 's#refs/heads/##' | sort -V | tail -n 1)"
            echo "$BRANCH" > branch_name.txt
          fi
          if [ -z "$BRANCH" ]; then
            echo "Branch was not created."
            echo "(.github/workflows のファイルを含む変更は、GITHUB_TOKEN では送れないことがあります)"
            exit 1
          fi
          echo "Branch: $BRANCH"

      # 成功したときだけ、ブランチを main に早送りで反映します。
      - name: Merge into main
        id: merge_main
        if: always() && steps.check_result.outputs.RESOLUTION_SUCCESS == 'true' && steps.push_branch.outcome == 'success'
        run: |
          BRANCH="$(cat /tmp/branch_name.txt)"
          echo "MERGED=false" >> "$GITHUB_OUTPUT"
          if [ -z "$BRANCH" ]; then
            echo "No branch name found."; exit 0
          fi
          git config user.name "openhands-agent"
          git config user.email "openhands-agent@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git diff --name-status HEAD FETCH_HEAD > /tmp/files.txt
          git diff --stat HEAD FETCH_HEAD > /tmp/diffstat.txt
          if git merge --ff-only FETCH_HEAD && git push origin "HEAD:${TARGET_BRANCH}"; then
            echo "MERGED=true" >> "$GITHUB_OUTPUT"
            echo "MERGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git push origin --delete "$BRANCH" || true
          else
            echo "Could not fast-forward ${TARGET_BRANCH}; the branch '$BRANCH' is kept."
          fi

      - name: Comment summary on issue
        uses: actions/github-script@v9
        if: always()
        env:
          RESOLUTION_SUCCESS: ${{ steps.check_result.outputs.RESOLUTION_SUCCESS }}
          MERGED: ${{ steps.merge_main.outputs.MERGED }}
          MERGED_SHA: ${{ steps.merge_main.outputs.MERGED_SHA }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const base = `https://github.com/${owner}/${repo}`;
            const runUrl = `${base}/actions/runs/${context.runId}`;
            const read = (p) => { try { return fs.readFileSync(p, 'utf8').trim(); } catch (e) { return ''; } };
            const success = process.env.RESOLUTION_SUCCESS === 'true';
            const merged = process.env.MERGED === 'true';
            const sha = process.env.MERGED_SHA || '';
            const branch = read('/tmp/branch_name.txt');
            const files = read('/tmp/files.txt');
            const stat = read('/tmp/diffstat.txt').split('\n').pop();
            const target = process.env.TARGET_BRANCH;

            let sm = {};
            try { sm = JSON.parse(read('/tmp/summary.json')); } catch (e) {}

            const diag = [
              `- AIの判定: ${sm.success ? '解決できた' : '解決できなかった'}`,
              `- ファイルの変更: ${sm.has_patch ? 'あり' : 'なし'}`,
              `- AIの動いた回数(イベント数): ${sm.events ?? '不明'}`,
              sm.error ? `- エラー: ${sm.error}` : '',
              sm.last_agent ? `- AIの最後の動き: ${sm.last_agent}` : '',
            ].filter(Boolean).join('\n');

            const details = sm.explanation
              ? `\n\n<details><summary>AIの判定メモ</summary>\n\n${sm.explanation}\n\n</details>`
              : '';

            let body;
            if (success && merged) {
              body = [
                `## 作業のまとめ`,
                `Issue の内容を実装し、**${target}** に直接反映しました。`,
                ``,
                `- 反映したコミット: ${base}/commit/${sha}`,
                `- 変更の規模: ${stat || '(不明)'}`,
                ``,
                `変更したファイル(A=追加, M=変更, D=削除):`,
                '```',
                files || '(なし)',
                '```',
                `GitHub Pages を有効にしている場合は、1〜2分後に公開内容が更新されます。`,
                `ログ: ${runUrl}`,
              ].join('\n') + details;
            } else if (success && branch) {
              body = [
                `## 作業のまとめ`,
                `実装はできましたが、${target} が更新されていたため、直接の反映はしませんでした。`,
                `変更はブランチ \`${branch}\` に残してあります: ${base}/tree/${branch}`,
                `ログ: ${runUrl}`,
              ].join('\n') + details;
            } else if (branch) {
              body = [
                `## 作業のまとめ`,
                `自動での解決はできませんでした。${target} は変更していません。`,
                `試した内容はブランチ \`${branch}\` に残してあります: ${base}/tree/${branch}`,
                ``,
                diag,
                `ログ: ${runUrl}`,
              ].join('\n') + details;
            } else if (sm.no_output) {
              // AIとの通信失敗などで、結果ファイル自体ができなかったとき
              body = [
                `## 作業のまとめ`,
                `AIとの通信がうまくいかず(混雑・利用上限など)、作業を終えられませんでした。${target} は変更していません。`,
                `時間をおいて、ラベルを付け直すか、もう一度コメントしてください。`,
                ``,
                `ログ: ${runUrl}`,
              ].join('\n');
            } else if (sm.answer && sm.has_patch === false) {
              // ファイルの変更がなく、AIの回答があるとき(質問への回答)
              body = [
                `## 回答`,
                sm.answer,
                ``,
                `---`,
                `ファイルの変更はなく、${target} は変更していません。ログ: ${runUrl}`,
              ].join('\n');
            } else {
              body = [
                `## 作業のまとめ`,
                `AIは作業を終えましたが、保存できる変更がありませんでした。${target} は変更していません。`,
                ``,
                diag,
                `ログ: ${runUrl}`,
              ].join('\n') + details;
            }
            await github.rest.issues.createComment({ issue_number, owner, repo, body });
