<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在庫管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="stock.webmanifest">
<link rel="apple-touch-icon" href="stock-icon-180.png">
<link rel="icon" href="stock-icon-192.png">
<title>せどり在庫管理</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#111827;--muted:#6b7280;--line:#e5e7eb;--danger:#dc2626;--in:#16a34a;--out:#ea580c;--accent:var(--in)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--fg:#f3f4f6;--muted:#9ca3af;--line:#263041}}
body[data-mode=in]{--accent:var(--in)}
body[data-mode=out]{--accent:var(--out)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom))}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:16px 0 8px}
h4{font-size:14px;margin:14px 0 6px;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
button{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
button:active{opacity:.7}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger)}
label{display:block;margin:8px 0;font-size:14px;color:var(--muted)}
label input{margin-top:4px;color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>select,.row>input{flex:1}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.sm{font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg button{padding:16px;font-size:20px;font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);flex:none}
.stepper button{border:0;background:none;font-size:22px;padding:8px 14px}
.stepper output{min-width:46px;text-align:center;font-size:20px;font-weight:700;cursor:pointer}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;border:3px solid var(--accent)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:2px dashed rgba(255,255,255,.8);border-radius:8px;pointer-events:none}
.cam .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;background:rgba(0,0,0,.35)}
.cam .tag{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;padding:2px 10px;border-radius:99px;font-weight:700;font-size:14px}
.big{width:100%;margin:10px 0;padding:14px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px;margin:10px 0}
.card.in{border-left-color:var(--in)}.card.out{border-left-color:var(--out)}
.card .l1{font-size:17px}.card .l2{color:var(--muted);font-size:14px;margin:4px 0 8px}
.banner{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;cursor:pointer}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.item{cursor:pointer}
.nm{font-weight:600;word-break:break-word}
.qty{font-size:24px;font-weight:700;min-width:40px;text-align:right}.qty.neg{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.chk{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}.chk input{width:auto}
.tag-in{color:var(--in);font-weight:700}.tag-out{color:var(--out);font-weight:700}
.undone{text-decoration:line-through;opacity:.5}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{border:0;border-radius:0;background:none;padding:10px 0;font-size:12px;color:var(--muted)}
#tabs button span{display:block;font-size:20px}
#tabs button[aria-current=true]{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:60;font-size:14px}
#toast.show{opacity:.95}#toast.err{background:var(--danger)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin-top:0;font-size:18px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1;min-width:30%}
.pick{display:block;width:100%;margin:6px 0;text-align:left}
.kxline{margin:4px 0 8px}.kxline button{margin-left:6px;padding:4px 10px;font-size:13px}
.kxlist{list-style:none;margin:8px 0;padding:0}
.kxlist li{border-bottom:1px solid var(--line);padding:8px 2px}
.kxlist a{display:flex;justify-content:space-between;gap:10px;color:inherit;text-decoration:none}
.kxlist .pr{font-weight:700;white-space:nowrap}.kxlist li.stop{opacity:.55}
#log li[data-jan]{cursor:pointer}
.camrow .big{margin:10px 0}#camBtn{flex:2}#photoBtn{flex:1}
.verfoot{text-align:center;margin:18px 0 6px}
.okpop{text-align:center;padding:4px 0 8px}.okpop .mark{width:72px;height:72px;margin:4px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff;background:var(--in)}
.okpop.out .mark{background:var(--out)}.okpop.err .mark{background:var(--danger)}
.okpop .what{font-size:20px;font-weight:800}.okpop .nm{font-size:16px;font-weight:600;margin:4px 0}
.shoplist{list-style:none;margin:8px 0;padding:0}.shoplist a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.shoplist a::after{content:'›';float:right;color:var(--muted)}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li button{margin-left:auto;padding:4px 10px;font-size:12px}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.set button{margin:4px 4px 4px 0}
</style>
</head>
<body data-mode="in">
<main>
  <section id="v-scan">
    <div id="bkBanner" class="banner" hidden></div>
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="in">入庫</button>
      <button type="button" data-mode="out">出庫</button>
    </div>
    <div class="row">
      <select id="locSel" aria-label="倉庫"></select>
      <div class="stepper"><button type="button" id="qtyMinus" aria-label="減らす">−</button><output id="qty">1</output><button type="button" id="qtyPlus" aria-label="増やす">＋</button></div>
    </div>
    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="tag" id="camTag">入庫</div>
      <div class="msg" id="camMsg">カメラは停止中</div>
    </div>
    <div class="row camrow">
      <button type="button" id="camBtn" class="big primary">カメラを開始</button>
      <button type="button" id="photoBtn" class="big">写真で読む</button>
    </div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <div class="muted sm">カメラを開始して、バーコードを枠の中に<b>横向き</b>に映すと<b>自動で読み取ります</b>(シャッターは不要)。読めないときは「写真で読む」でバーコードを大きく撮ってください。</div>
    <form id="manual" class="row">
      <input id="manualJan" inputmode="numeric" placeholder="JANを手入力(8桁・13桁)" maxlength="13" autocomplete="off">
      <button type="submit">記録</button>
    </form>
    <div id="last" class="card" hidden></div>
    <h3>今回の記録</h3>
    <ul id="log" class="list"></ul>
    <div class="muted sm verfoot" id="verFoot"></div>
  </section>
  <section id="v-stock" hidden></section>
  <section id="v-locs" hidden></section>
  <section id="v-settings" hidden></section>
</main>
<nav id="tabs">
  <button type="button" data-tab="scan"><span>📷</span>スキャン</button>
  <button type="button" data-tab="stock"><span>📦</span>在庫</button>
  <button type="button" data-tab="locs"><span>🏭</span>倉庫</button>
  <button type="button" data-tab="settings"><span>⚙️</span>設定</button>
</nav>
<div id="toast"></div>
<div id="modal" hidden></div>
<noscript>このアプリにはJavaScriptが必要です。</noscript>
<script src="stock-version.js"></script>
<script src="stock.js"></script>
</body>
</html>
